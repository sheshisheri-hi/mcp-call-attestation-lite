[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-call-attestation"
version = "0.1.0"
description = "Educational MCP sample: pin the tool menu, attest the call, hash-link the receipts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sheshi Sheri" }]
keywords = ["mcp", "security", "sep-2787", "sep-3140", "sep-3004", "attestation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[project.urls]
Repository = "https://github.com/sheshisheri-hi/mcp-call-attestation-lite"
SEP2787 = "https://github.com/modelcontextprotocol/modelcontextprotocol/pull/2787"
SEP3004 = "https://github.com/modelcontextprotocol/modelcontextprotocol/pull/3004"
Sibling = "https://github.com/sheshisheri-hi/mcp-meta-gate-showcase"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
